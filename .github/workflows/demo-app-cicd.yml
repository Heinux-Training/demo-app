name: "Demo App Workflow"

on:
  workflow_dispatch: null
  # push:
  #   branches:
  #     - "main"
  #     - "*-release"
  pull_request:
    types: [opened, synchronize, reopened]
    branches: 
      - "main"
      - "*-release"

jobs:
  unit-testing:
    strategy:
      matrix:
        node-version: [18, 20]
    name: Unit Testing
    runs-on: ["self-hosted", "heinux", "demo-app", "development"]
    container:
      image: "node:${{ matrix.node-version }}"
    env:
      MONGO_URI: "${{ secrets.MONGO_URI }}"
      MONGO_USERNAME: "${{ secrets.MONGO_USERNAME }}"
      MONGO_PASSWORD: "${{ secrets.MONGO_PASSWORD }}"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Cache NPM dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: "${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}"
      - name: Install Dependencies
        run: npm install
      - name: Unit Testing
        run: npm test
      - name: Archive Test Result
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: Mocha-Test-Result
          path: test-results.xml
  code-coverage:
    strategy:
      matrix:
        node-version: [20]
    runs-on: ["self-hosted", "heinux", "demo-app", "development"]
    env:
      MONGO_URI: "${{ secrets.MONGO_URI }}"
      MONGO_USERNAME: "${{ secrets.MONGO_USERNAME }}"
      MONGO_PASSWORD: "${{ secrets.MONGO_PASSWORD }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: ${{matrix.node-version}}
      - name: Install Dependencies
        run: npm install
      - name: Run Code Coverage Job
        continue-on-error: true
        run: npm run coverage
      - uses: actions/upload-artifact@v3
        with:
          name: Code-Coverage-Result
          path: coverage
          retention-days: 3
  docker:
    permissions:
      packages: write
    runs-on: ["self-hosted", "heinux", "demo-app", "development"]
    needs:
      - code-coverage
      - unit-testing
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v2.2.0
        with:
          registry: ghcr.io
          username: "${{ github.repository_owner }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Convert GitHub Docker Repository into lowercase
        run: |
          echo "REPO_NAME=`echo ${{github.repository}} | tr '[:upper:]' '[:lower:]'`" >> ${GITHUB_ENV}
      - uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: >-
            ghcr.io/${{ env.REPO_NAME }}/demo_app:${{ github.sha}}
  dev-deploy:
    if: github.ref == 'refs/heads/develop-release'
    needs: docker
    runs-on: ["self-hosted", "heinux", "demo-app", "development"]
    environment:
      name: development
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v3
        with:
          version: v1.26.0
      # - uses: azure/k8s-set-context@v3
      #   with:
      #     method: kubeconfig
      #     kubeconfig: "${{ secrets.KUBECONFIG }}"
      - run: kubectl version --short -o yaml
      # Below codes are added to complete the task
      - uses: cschleiden/replace-tokens@v1
        with:
          tokenPrefix: "_{_"
          tokenSuffix: "_}_"
          files: '["kubernetes/development/*.yaml"]'
        env:
          NAMESPACE: "${{ vars.NAMESPACE }}"
          REPLICAS: "${{ vars.REPLICAS }}"
          IMAGE: >-
            ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha}}
          DOMAINNAME: "${{ vars.DOMAINNAME }}"
      - run: cat kubernetes/development/*.yaml
